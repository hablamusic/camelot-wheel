<g class="v0"><clipPath id="k0"><rect class="c0" x="22" y="65" height="21" width="0"/></clipPath><text x="22" y="81" clip-path="url(#k0)"><tspan class="p">$</tspan> npx github:hablamusic/camelot-wheel &quot;La menor&quot;</text></g><text class="o v1" x="22" y="102" xml:space="preserve">A minor  ·  Camelot 8A  ·  Open Key 1m  ·  ES La men</text><text class="o v2" x="22" y="123" xml:space="preserve">Relative: C major</text><text class="o v3" x="22" y="144" xml:space="preserve"></text><text class="o v4" x="22" y="165" xml:space="preserve">Mixes with</text><text class="o v5" x="22" y="186" xml:space="preserve">  8A   A minor    same key           safe     Perfec</text><text class="o v6" x="22" y="207" xml:space="preserve">  9A   E minor    +1                 safe     One st</text><text class="o v7" x="22" y="228" xml:space="preserve">  7A   D minor    -1                 safe     One st</text><text class="o v8" x="22" y="249" xml:space="preserve">  8B   C major    relative major     safe     Same n</text><text class="o v9" x="22" y="270" xml:space="preserve">  10A  B minor    +2                 energy   Two st</text><text class="o v10" x="22" y="291" xml:space="preserve"></text><g class="v11"><clipPath id="k11"><rect class="c11" x="22" y="296" height="21" width="0"/></clipPath><text x="22" y="312" clip-path="url(#k11)"><tspan class="p">$</tspan> npx github:hablamusic/camelot-wheel mix 96 8A 94 2A</text></g><text class="o v12" x="22" y="333" xml:space="preserve">Deck A: 96 BPM, A minor (8A)</text><text class="o v13" x="22" y="354" xml:space="preserve">Deck B: 94 BPM, Eb minor (2A)</text><text class="o v14" x="22" y="375" xml:space="preserve"></text><text class="o v15" x="22" y="396" xml:space="preserve">Score: 43/100 (workable with edits)</text><text class="o v16" x="22" y="417" xml:space="preserve">Tempo: stretch B by +2.1% to 96 BPM</text><text class="o v17" x="22" y="438" xml:space="preserve">Keys as they are: clash</text><text class="o v18" x="22" y="459" xml:space="preserve">Without key lock B lands on 2A (+0.4 st): not compatible</text><text class="o v19" x="22" y="480" xml:space="preserve">Best pitch shift for B: -1 semitones -&gt; 7A (compatible)</text>
